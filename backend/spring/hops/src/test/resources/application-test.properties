# 자동 테스트 전용 설정. 테스트는 @ActiveProfiles({"db", "test"})로 실행하며, 뒤에 적은 test가 db 값을 덮어쓴다.
# 개발용 hops DB 대신 테스트 전용 hops_test DB를 쓴다. 접속 계정·비밀번호는 db 프로필과 같다.
spring.datasource.url=jdbc:postgresql://localhost:5432/hops_test
# 가상 데이터(db/seed)는 넣지 않는다. 테스트에 필요한 데이터는 각 테스트가 직접 넣는다.
# db/test-migration은 테스트 전용 테이블(예: BaseEntityTest의 test_sample)이다.
spring.flyway.locations=classpath:db/migration,classpath:db/test-migration
# Redis도 개발용(0번)과 섞이지 않게 테스트 전용 15번 DB를 쓴다.
spring.data.redis.database=15
# 로컬 http 개발과 같이 Refresh 쿠키 Secure를 끈다. 기본값(true)은 RefreshCookiePropertiesTest가 확인한다.
hops.auth.refresh-cookie.secure=false
