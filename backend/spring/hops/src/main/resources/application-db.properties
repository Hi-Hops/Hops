# db 프로필: 로컬 PostgreSQL에 연결한다. 실행: SPRING_PROFILES_ACTIVE=db ./gradlew bootRun
#
# 접속 주소·계정·비밀번호는 저장소에 올리지 않는다 (Spring README "실제 접속 정보는 저장소에 기록하지 않는다").
# 각자 application-db.local.properties.example을 복사해 application-db.local.properties를 만들고 값을 넣는다.
# 그 파일은 .gitignore(application-*.local.properties)로 git에서 제외된다.
# SPRING_DATASOURCE_URL 등 환경변수를 설정하면 파일 값보다 환경변수가 우선한다.
spring.config.import=optional:classpath:application-db.local.properties

# Flyway: 서버 시작 시 db/migration의 SQL 중 아직 적용하지 않은 것만 순서대로 실행한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
