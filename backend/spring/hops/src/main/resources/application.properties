spring.application.name=hops
# 기본 프로필: 로컬 PostgreSQL에 연결한다 (application-db.properties). 프로필을 따로 주지 않아도 db로 실행된다.
spring.profiles.default=db
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# 모든 로그 줄에 RequestIdFilter가 넣은 requestId를 붙인다.
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# 시각은 UTC로 저장·응답한다 (docs/API.md §1 "UTC RFC 3339", docs/DATA.md §1 "timestamptz").
# 한국 시간 표시는 화면에서 한다.
# API 응답 JSON: OffsetDateTime 등 시간대가 있는 값도 UTC(...Z)로 바꿔 내보낸다.
spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-with-context-time-zone=true
# DB 저장·조회: 서버 PC의 시간대와 상관없이 UTC 기준으로 처리한다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS로 허용할 프론트 주소 (쉼표로 여러 개). 기본값은 Vite 개발 서버 포트(docs/AGENT_DEVELOPMENT.md 10장 Vite).
# 브라우저는 localhost와 127.0.0.1을 다른 주소로 본다. 프론트 README는 127.0.0.1:5173 접속을 안내하므로 둘 다 허용한다.
hops.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
# JWT 검증 (global/security/JwtProperties). Spring만 발급·검증하므로 Spring만 아는 비밀키 하나(HS256)를 쓴다.
# 아래 secret은 각자 PC 개발용 값이다. 공용·운영 서버에서는 환경변수 HOPS_JWT_SECRET으로 반드시 바꾼다.
hops.jwt.secret=hops-local-dev-only-secret-change-me-32bytes+
hops.jwt.issuer=hops
hops.jwt.audience=hops-api
# 서버끼리 시계가 조금 어긋나도 만료 판정이 틀리지 않게 두는 여유 시간
hops.jwt.clock-skew=30s
# Refresh 쿠키 Secure(hops.auth.refresh-cookie.secure)는 여기 두지 않는다. 설정이 없으면 true(안전한 쪽)다.
# 로컬 http 개발만 application-db.local.properties 또는 Docker의 .env에서 false로 끈다 (RefreshCookieProperties).
# 앞단 프록시(Nginx·로드밸런서)가 HTTPS를 처리하고 X-Forwarded-Proto 등으로 알려주면, 원래 요청 방식(https)으로 인식한다.
server.forward-headers-strategy=framework

# Python AI 서버 연결 (agent/client/AgentProperties). 운영·공용 환경에서는 주소만 바꾼다.
hops.agent.base-url=http://localhost:8000
hops.agent.connect-timeout=3s
# 에이전트 전체 실행 제한 90초 (contracts/agents/README.md §6)
hops.agent.read-timeout=90s

# 상담 실행 접수 한도 (WIRE_CONTRACT AI 실행 초기 상한: 전체 60초, 호출 8회, 재시도 2회, 호출당 출력 1,500토큰)
# limits는 실행 전체의 누적 한도다 (contracts/agents/README.md ExecutionLimits). 그래서 max-output-tokens는
# 호출당 상한 1,500에 호출 수를 곱한 실행 합계(8 x 1,500)다. 호출당 값을 그대로 넣으면 모델 호출 두세 번에 BUDGET_EXCEEDED가 난다.
# 입력 토큰·도구 호출 수는 계약에 수치가 없어 임시 값이다. 모델·프롬프트 버전은 AI 서버와 정하기 전까지 자리값, 스키마 버전은 계약 이름이다.
hops.agent.run.deadline=60s
hops.agent.run.limits.max-model-calls=8
hops.agent.run.limits.max-input-tokens=60000
hops.agent.run.limits.max-output-tokens=12000
hops.agent.run.limits.max-tool-calls=10
hops.agent.run.limits.max-retries=2
hops.agent.run.model-version=pending
hops.agent.run.prompt-version=pending
hops.agent.run.schema-version=hops-system-1

# Redis (#58): Refresh 토큰·로그인 세션 저장소. 로컬은 brew services start redis (기본 localhost:6379).
# 운영·공용 서버에서는 환경변수 SPRING_DATA_REDIS_HOST·SPRING_DATA_REDIS_PORT·SPRING_DATA_REDIS_PASSWORD로 바꾼다.
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 0번 DB는 개발용. 테스트는 application-test.properties에서 다른 번호를 쓴다.
spring.data.redis.database=0

# SSE 개발 기본값. 운영 heartbeat/timeout은 프록시와 부하 검증 후 조정한다.
hops.realtime.heartbeat=15s
hops.realtime.timeout=5m

# 중복 요청 방지 기록 정리 (global/idempotency/IdempotencyTombstoneScheduler). 보존 기간(24시간)이 지난 기록의 응답 본문을 비운다.
# 행·키는 남겨 같은 키의 새 실행을 계속 막는다. 이전 정리가 끝난 뒤 interval만큼 기다린다.
hops.idempotency.tombstone.enabled=true
hops.idempotency.tombstone.initial-delay=PT1M
hops.idempotency.tombstone.interval=PT1H

# 승인된 해결 사례(CASE)를 검색 근거로 공개하는 조건 (knowledge/domain/CaseVisibility, contracts/agents/KNOWLEDGE_TOOLS.md)
# APPROVED_SNAPSHOT: 1차 SQL 검색. 승인된 현재 사례 스냅샷이면 공개한다(색인 상태는 조건이 아니다).
# INDEXED: 2차. 계약대로 Vector·Neo4j 반영이 모두 SUCCEEDED여야 공개한다. 색인 상태는 어느 쪽에서도 SUCCEEDED로 바꾸지 않는다.
hops.knowledge.case-visibility=APPROVED_SNAPSHOT

# 내부 판단 경계(옵션, 기본 꺼짐). 켜면 직원 상담 실행 입력에 accessContext.retrievalScopes가 실려 AI가 담당자 전용 자료를 내부 판단 입력으로 읽는다
# (docs/ai/AGENT_ARCHITECTURE.md 9절, contracts/agents/KNOWLEDGE_TOOLS.md). SECURITY.md 개정과 보안 리뷰 전에는 켜지 않는다.
hops.agent.run.internal-judgement.enabled=false
