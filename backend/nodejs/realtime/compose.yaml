name: hops-realtime-local

services:
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '${PORT:-3001}'
      SPRING_BASE_URL: '${SPRING_BASE_URL:-http://host.docker.internal:8080}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:5173}'
      SOCKET_PATH: '${SOCKET_PATH:-/socket.io}'
      NODE_SERVICE_TOKEN: '${NODE_SERVICE_TOKEN:?NODE_SERVICE_TOKEN을 설정하세요.}'
      SPRING_SERVICE_TOKEN: '${SPRING_SERVICE_TOKEN:?SPRING_SERVICE_TOKEN을 설정하세요.}'
    init: true
    ports:
      - '127.0.0.1:${PORT:-3001}:${PORT:-3001}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
