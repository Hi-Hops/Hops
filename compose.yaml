name: hops-dev

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: hops
      POSTGRES_USER: hops
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U hops -d hops']
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./ai
    ports:
      - '127.0.0.1:${AI_PORT:-8000}:8000'

  backend:
    build:
      context: ./backend/spring/hops
    environment:
      SPRING_PROFILES_ACTIVE: db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hops
      SPRING_DATASOURCE_USERNAME: hops
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 설정하세요}'
      HOPS_JWT_SECRET: '${HOPS_JWT_SECRET:?루트 .env에 32바이트 이상의 HOPS_JWT_SECRET을 설정하세요}'
      HOPS_AGENT_BASEURL: http://ai:8000
      HOPS_CORS_ALLOWEDORIGINS: 'http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_DATA_MODE: live
      VITE_API_BASE_URL: 'http://localhost:${BACKEND_PORT:-8080}'
    init: true
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'

volumes:
  postgres-data:
