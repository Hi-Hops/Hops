name: hops-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    env_file: ./infra/postgres/.env
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # 로그인 세션·Refresh 토큰 저장소. 포트는 PC에 공개하지 않는다(PC에 설치한 Redis 6379와 겹치지 않게).
  # 안을 볼 때는 docker compose exec redis redis-cli. 디스크에 저장하지 않아 재시작하면 세션이 비워져 다시 로그인한다.
  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./ai
    env_file: ./ai/.env
    ports:
      - '127.0.0.1:${AI_PORT:-8000}:8000'

  backend:
    build:
      context: ./backend/spring/hops
    env_file: ./backend/spring/hops/.env
    # env_file 값은 Compose 치환 대상이 아니므로 필수 값은 앱 시작 전에 검사한다.
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        : "$${SPRING_DATASOURCE_URL:?backend/spring/hops/.env에 SPRING_DATASOURCE_URL을 설정하세요}"
        : "$${SPRING_DATASOURCE_USERNAME:?backend/spring/hops/.env에 SPRING_DATASOURCE_USERNAME을 설정하세요}"
        : "$${SPRING_DATASOURCE_PASSWORD:?backend/spring/hops/.env에 SPRING_DATASOURCE_PASSWORD를 설정하세요}"
        : "$${HOPS_JWT_SECRET:?backend/spring/hops/.env에 HOPS_JWT_SECRET을 설정하세요}"
        exec java -jar /app/app.jar
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ./frontend/.env
    init: true
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'

volumes:
  postgres-data:
