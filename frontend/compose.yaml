name: hops-frontend-local

services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      VITE_DATA_MODE: '${VITE_DATA_MODE:-mock}'
      VITE_API_BASE_URL: '${VITE_API_BASE_URL:-}'
      VITE_SOCKET_URL: '${VITE_SOCKET_URL:-}'
      VITE_SOCKET_PATH: '${VITE_SOCKET_PATH:-/socket.io}'
      VITE_MOCK_REQUESTER_ID: '${VITE_MOCK_REQUESTER_ID:-}'
      VITE_MOCK_PREVIEW_ID: '${VITE_MOCK_PREVIEW_ID:-}'
      VITE_MOCK_NETWORK_ID: '${VITE_MOCK_NETWORK_ID:-}'
      VITE_MOCK_BACKEND_ID: '${VITE_MOCK_BACKEND_ID:-}'
      VITE_MOCK_ADMIN_ID: '${VITE_MOCK_ADMIN_ID:-}'
      VITE_MOCK_PASSWORD: '${VITE_MOCK_PASSWORD:-}'
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5
