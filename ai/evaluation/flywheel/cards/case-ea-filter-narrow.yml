# 선순환 묶음의 사례 A. 시드가 아니다: 시험 중 실제 흐름(문의 A → 담당자 처리 → 해결 확인 → Curator 초안 → 승인)으로 만들어진다.
# 이 파일은 "담당자가 미래에 남길 처리 기록"과 "좋은 사례의 모습"을 담은 평가 파일이며 AI 런타임, 시드 변환, 지식 문서
# 적재가 읽지 못하는 위치에만 둔다(docs/knowledge/cases/에 두지 않는다). 카드 형식은 정본 7.1절을 따르되 대화·표준 요청은
# 실제 흐름이 만들므로 쓰지 않는다.
caseKey: case-ea-filter-narrow
system: ELECTRONIC_APPROVAL
feature: DOCUMENT_VIEW
assignee: ea_owner

ticket:
  title: "전자결재 문서함에서 상신한 문서가 조회 목록에 나오지 않음"
  detail: "문의자가 지난주에 상신한 문서를 문서함 조회에서 찾지 못한다. 조회 기간은 기본값이다."

workLogs:
  - type: PROGRESS
    action: "문서의 기안일이 조회 기간 안이고 문의자가 기안한 문서임을 확인했다. 문의자가 조회할 때 입력한 상태와 제목 키워드를 물어 확인하는 중이다."
    confirmedCause: null
    verification: null
  - type: RESOLVED
    action: "문의자에게 조회 조건의 상태를 '전체'로 바꾸고 다시 [조회]하도록 안내했다."
    confirmedCause: "조회 조건의 상태를 '승인'으로 골라 두어, 결재 중인 해당 문서가 조건에 맞지 않아 목록에서 제외됐다."
    verification: "상태를 '전체'로 바꿔 다시 조회하자 문서가 목록에 표시되는 것을 문의자가 확인했다."

# 좋은 사례 초안의 모습. 모델 입력으로 쓰지 않고 Curator 결과를 사람이 검수할 때 기준으로만 쓴다.
expectedCase:
  title: "전자결재 문서가 목록에 안 보임 - 조회 조건의 상태·제목 키워드가 좁음"
  problemStatement: "전자결재 문서함에서 상신한 문서가 조회 목록에 나오지 않는다."
  applicability: "조회 조건에 상태나 제목 키워드를 입력했고 문서가 그 조건에 맞지 않는 경우에 한한다. 조건을 비우거나 '전체'로 두고도 문서가 없으면 기간과 열람 권한을 따로 확인하며 이 사례를 적용하지 않는다."
  limitations:
    - "조건을 모두 비웠는데도 목록에 없으면 이 사례를 적용하지 않는다."
    - "조회 기간(기안일 기준)과 열람 권한은 이 사례가 확인한 범위가 아니다."

