services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-hops}'
      POSTGRES_USER: '${POSTGRES_USER:-hops}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?backend/spring/hops/.env에 POSTGRES_PASSWORD를 설정하세요}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # 로그인 세션·Refresh 토큰 저장소. 포트는 PC에 공개하지 않는다(PC에 설치한 Redis 6379와 겹치지 않게).
  # 안을 볼 때는 docker compose exec redis redis-cli. 디스크에 저장하지 않아 재시작하면 세션이 비워져 다시 로그인한다.
  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: 'neo4j/${HOPS_NEO4J_PASSWORD:-local-hops-graph}'
      NEO4J_server_memory_heap_max__size: '384m'
      NEO4J_server_memory_pagecache_size: '128m'
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
    volumes:
      - neo4j-data:/data

  ai:
    build:
      context: ./ai
    environment:
      HOPS_AI_MODE: '${HOPS_AI_MODE:-scaffold}'
      HOPS_AI_SUPERVISOR_MODEL: '${HOPS_AI_SUPERVISOR_MODEL:-gpt-6-luna}'
      HOPS_AI_TICKET_TOOLS_ENABLED: '${HOPS_AI_TICKET_TOOLS_ENABLED:-true}'
      HOPS_AI_SPRING_BASE_URL: '${HOPS_AI_SPRING_BASE_URL:-http://backend:8080}'
      SPRING_SERVICE_TOKEN: '${SPRING_SERVICE_TOKEN:-}'
      HOPS_AI_TICKET_HTTP_TIMEOUT_SECONDS: '${HOPS_AI_TICKET_HTTP_TIMEOUT_SECONDS:-5}'
      HOPS_AI_TICKET_MAX_QUERIES: '${HOPS_AI_TICKET_MAX_QUERIES:-4}'
      HOPS_AI_TICKET_MAX_ATTEMPTS: '${HOPS_AI_TICKET_MAX_ATTEMPTS:-3}'
      HOPS_AI_TICKET_POLL_INTERVAL_SECONDS: '${HOPS_AI_TICKET_POLL_INTERVAL_SECONDS:-0.25}'
      HOPS_AI_KNOWLEDGE_ASSESSMENT: '${HOPS_AI_KNOWLEDGE_ASSESSMENT:-false}'
      HOPS_AI_GUIDE_EXCERPT: '${HOPS_AI_GUIDE_EXCERPT:-true}'
      HOPS_AI_KNOWLEDGE_SOURCE: '${HOPS_AI_KNOWLEDGE_SOURCE:-none}'
      HOPS_AI_KNOWLEDGE_HTTP_TIMEOUT_SECONDS: '${HOPS_AI_KNOWLEDGE_HTTP_TIMEOUT_SECONDS:-5}'
      HOPS_AI_RUN_DEADLINE_SECONDS: '${HOPS_AI_RUN_DEADLINE_SECONDS:-60}'
      HOPS_AI_LLM_CALL_TIMEOUT_SECONDS: '${HOPS_AI_LLM_CALL_TIMEOUT_SECONDS:-30}'
      HOPS_AI_MAX_LLM_CALLS: '${HOPS_AI_MAX_LLM_CALLS:-8}'
      HOPS_AI_MAX_AUTO_RETRIES: '${HOPS_AI_MAX_AUTO_RETRIES:-2}'
      HOPS_AI_MAX_OUTPUT_TOKENS: '${HOPS_AI_MAX_OUTPUT_TOKENS:-1500}'
      HOPS_AI_MAX_RUN_INPUT_TOKENS: '${HOPS_AI_MAX_RUN_INPUT_TOKENS:-60000}'
      HOPS_AI_MAX_TOOL_CALLS: '${HOPS_AI_MAX_TOOL_CALLS:-10}'
      HOPS_AI_MAX_CONCURRENT_RUNS: '${HOPS_AI_MAX_CONCURRENT_RUNS:-4}'
      HOPS_AI_LEDGER_RECOVERY_INTERVAL_SECONDS: '${HOPS_AI_LEDGER_RECOVERY_INTERVAL_SECONDS:-60}'
      HOPS_AI_LEDGER_EXPIRY_INTERVAL_SECONDS: '${HOPS_AI_LEDGER_EXPIRY_INTERVAL_SECONDS:-3600}'
      HOPS_AI_INTERNAL_API_ENABLED: '${HOPS_AI_INTERNAL_API_ENABLED:-false}'
      HOPS_AI_RUNTIME_DSN: '${HOPS_AI_RUNTIME_DSN:-}'
      AI_SERVICE_TOKEN: '${AI_SERVICE_TOKEN:-}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      HOPS_AI_LANGFUSE_CAPTURE_CONTENT: '${HOPS_AI_LANGFUSE_CAPTURE_CONTENT:-false}'
      LANGFUSE_PUBLIC_KEY: '${LANGFUSE_PUBLIC_KEY:-}'
      LANGFUSE_SECRET_KEY: '${LANGFUSE_SECRET_KEY:-}'
      LANGFUSE_BASE_URL: '${LANGFUSE_BASE_URL:-}'
    ports:
      - '127.0.0.1:${AI_PORT:-8000}:8000'

  backend:
    build:
      context: ./backend/spring/hops
    environment:
      SPRING_PROFILES_ACTIVE: db
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hops}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-hops}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:?backend/spring/hops/.env에 POSTGRES_PASSWORD를 설정하세요}'
      HOPS_JWT_SECRET: '${HOPS_JWT_SECRET:?backend/spring/hops/.env에 32바이트 이상의 HOPS_JWT_SECRET을 설정하세요}'
      # AI와 한도를 조정할 때 Spring 실행 합계도 함께 설정한다.
      HOPS_AGENT_RUN_LIMITS_MAXMODELCALLS: '${HOPS_AI_MAX_LLM_CALLS:-8}'
      HOPS_AGENT_RUN_LIMITS_MAXOUTPUTTOKENS: '${HOPS_AGENT_RUN_LIMITS_MAXOUTPUTTOKENS:-12000}'
      HOPS_SEARCH_EMBEDDING_API_KEY: '${HOPS_SEARCH_EMBEDDING_API_KEY:-}'
      HOPS_SEARCH_NEO4J_URL: '${HOPS_SEARCH_NEO4J_URL:-http://neo4j:7474}'
      HOPS_NEO4J_PASSWORD: '${HOPS_NEO4J_PASSWORD:-local-hops-graph}'
      HOPS_AGENT_BASEURL: '${HOPS_AGENT_BASEURL:-http://ai:8000}'
      # Spring→AI 서비스 토큰. ai/.env의 같은 값을 쓰며 비어 있으면 AI 호출을 보내지 않고 실행을 실패로 끝낸다.
      AI_SERVICE_TOKEN: '${AI_SERVICE_TOKEN:-}'
      # AI→Spring 티켓 도구 전용. backend/spring/hops/.env에서 설정한다.
      SPRING_SERVICE_TOKEN: '${SPRING_SERVICE_TOKEN:-}'
      HOPS_CORS_ALLOWEDORIGINS: '${HOPS_CORS_ALLOWEDORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}'
      SPRING_DATA_REDIS_HOST: redis
      # 로컬 Docker는 http라 Refresh 쿠키 Secure를 끈다. HTTPS로 공개하는 환경은 .env에서 true로 바꾼다.
      HOPS_AUTH_REFRESHCOOKIE_SECURE: '${HOPS_AUTH_REFRESHCOOKIE_SECURE:-false}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_DATA_MODE: '${VITE_DATA_MODE:-live}'
      VITE_API_BASE_URL: '${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}'
      VITE_MOCK_REQUESTER_ID: '${VITE_MOCK_REQUESTER_ID:-}'
      VITE_MOCK_PREVIEW_ID: '${VITE_MOCK_PREVIEW_ID:-}'
      VITE_MOCK_NETWORK_ID: '${VITE_MOCK_NETWORK_ID:-}'
      VITE_MOCK_BACKEND_ID: '${VITE_MOCK_BACKEND_ID:-}'
      VITE_MOCK_ADMIN_ID: '${VITE_MOCK_ADMIN_ID:-}'
      VITE_MOCK_PASSWORD: '${VITE_MOCK_PASSWORD:-}'
    init: true
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'

volumes:
  postgres-data:
  neo4j-data:
