name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spring: ${{ steps.select.outputs.spring }}
      frontend: ${{ steps.select.outputs.frontend }}
      ai: ${{ steps.select.outputs.ai }}
      deployment: ${{ steps.select.outputs.deployment }}
      docs_only: ${{ steps.select.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed files
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-changes.cjs

  # 공백 오류가 있어도 선택된 테스트는 실행되도록 changes와 분리한다.
  whitespace:
    name: Whitespace check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace errors in the PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA"

  spring:
    name: Spring tests and build
    needs: changes
    if: needs.changes.outputs.spring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_DB: hops_test
          POSTGRES_USER: hops
          POSTGRES_PASSWORD: ci-only-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hops -d hops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hops_test
      SPRING_DATASOURCE_USERNAME: hops
      SPRING_DATASOURCE_PASSWORD: ci-only-fixture
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 15
    defaults:
      run:
        working-directory: backend/spring/hops
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build Spring
        run: ./gradlew --no-daemon test bootJar
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-test-report
          # 실패한 테스트 이름과 메시지는 JUnit XML에서도 바로 확인할 수 있다.
          path: |
            backend/spring/hops/build/test-results/test/*.xml
            backend/spring/hops/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types, lint, formatting and tests
        run: npm run check
      - name: Build frontend
        env:
          VITE_DATA_MODE: live
          VITE_API_BASE_URL: https://example.invalid
        run: npm run build

  ai:
    name: AI checks and PostgreSQL tests
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_DB: hops_ai_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hops_ai_runtime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HOPS_LEDGER_TEST_DSN: host=localhost port=5432 dbname=hops_ai_runtime_test user=postgres password=ci-only-fixture
      HOPS_INDEX_TEST_DSN: host=localhost port=5432 dbname=hops_ai_runtime_test user=postgres password=ci-only-fixture
      HOPS_LEDGER_LIMITED_TEST_DSN: host=localhost port=5432 dbname=hops_ai_runtime_test user=hops_ai_test password=ci-only-fixture
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        working-directory: ai
        run: |
          python -m pip install uv==0.12.9
          uv sync --locked
      - name: Prepare isolated test databases and limited role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'CREATE DATABASE hops_business_test'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'REVOKE CONNECT ON DATABASE hops_business_test FROM PUBLIC'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE hops_ai_test LOGIN PASSWORD 'ci-only-fixture'"
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test < ai/migrations/001_run_ledger.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test < ai/migrations/002_run_owner.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test < ai/migrations/003_index_jobs.sql
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test -c 'GRANT CONNECT ON DATABASE hops_ai_runtime_test TO hops_ai_test'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test -c 'GRANT USAGE ON SCHEMA public TO hops_ai_test'
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d hops_ai_runtime_test -c 'GRANT SELECT, INSERT, UPDATE ON public.ai_run_ledger TO hops_ai_test'
      - name: Check lint and formatting
        working-directory: ai
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run AI tests
        working-directory: ai
        run: uv run --no-sync pytest -ra

  deployment-checks:
    name: Deployment safety checks
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check deploy script and rollback behavior
        run: |
          bash -n deploy/ec2/deploy.sh
          python3 -m unittest discover -s deploy/ec2/tests -v
      # .github 변경은 모든 검사를 선택하므로 워크플로와 자동화 스크립트도 이 job에서 검사한다.
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.cjs
      - name: Check workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

  ci-gate:
    name: CI result
    if: always()
    needs: [changes, whitespace, spring, frontend, ai, deployment-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.cjs

  deploy:
    name: Deploy verified develop to EC2
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      vars.HOPS_AUTO_DEPLOY_ENABLED == 'true'
    needs: [changes, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: hops-ec2-deployment
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.HOPS_AWS_REGION }}
      HOPS_EC2_INSTANCE_ID: ${{ vars.HOPS_EC2_INSTANCE_ID }}
      PUBLIC_ORIGIN: ${{ vars.HOPS_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check deployment settings and current develop
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$HOPS_EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]
          [[ "$PUBLIC_ORIGIN" =~ ^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          latest=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer develop commit exists; this deployment is skipped.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether a documentation-only deployment can be skipped
        id: documentation
        if: steps.preflight.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: node .github/scripts/ci-docs-deploy.cjs
      - name: Configure AWS credentials using OIDC
        if: steps.preflight.outputs.current == 'true' && steps.documentation.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.HOPS_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.HOPS_AWS_REGION }}
          mask-aws-account-id: true
      - name: Build, check and publish immutable images
        id: images
        if: steps.preflight.outputs.current == 'true' && steps.documentation.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "$account" =~ ^[0-9]{12}$ ]]
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker build -t "$registry/hops-spring:$tag" backend/spring/hops
          docker build -t "$registry/hops-ai:$tag" ai
          docker build -f frontend/Dockerfile.deploy --build-arg "VITE_API_BASE_URL=$PUBLIC_ORIGIN" -t "$registry/hops-frontend:$tag" frontend
          docker run --rm --entrypoint java "$registry/hops-spring:$tag" -version
          docker run --rm --entrypoint python "$registry/hops-ai:$tag" -c 'import hops_ai.main'
          docker run --rm --entrypoint sh "$registry/hops-frontend:$tag" -c 'test -s /srv/index.html && test -d /srv/assets && test -s /etc/nginx/templates/default.conf.template'
          for service in spring ai frontend; do
            repo="hops-$service"
            docker push "$registry/$repo:$tag"
            digest=''
            for attempt in {1..6}; do
              digest=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
              sleep 5
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$service=$registry/$repo@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Deploy through Systems Manager
        if: steps.preflight.outputs.current == 'true' && steps.documentation.outputs.skip != 'true'
        env:
          SPRING_IMAGE: ${{ steps.images.outputs.spring }}
          AI_IMAGE: ${{ steps.images.outputs.ai }}
          WEB_IMAGE: ${{ steps.images.outputs.frontend }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer develop commit exists; this deployment is skipped.'
            exit 0
          fi
          export SPRING_MIGRATION_TREE AI_MIGRATION_TREE PUBLIC_HOST DEPLOYMENT_ID
          SPRING_MIGRATION_TREE=$(git rev-parse "$GITHUB_SHA:backend/spring/hops/src/main/resources/db/migration")
          AI_MIGRATION_TREE=$(git rev-parse "$GITHUB_SHA:ai/migrations")
          PUBLIC_HOST=${PUBLIC_ORIGIN#https://}
          DEPLOYMENT_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 deploy/ec2/send_ssm.py
