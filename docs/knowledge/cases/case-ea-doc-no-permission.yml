    text: "문서가 보이지 않아 불편하시겠어요. 두 가지만 여쭤볼게요. 이 문서를 직접 기안하셨나요, 아니면 결재선이나 참조로 받으셨나요? 그리고 문서함에서 조회 기간은 어떻게 설정하셨나요?"
  - sender: USER
    text: "제가 기안한 문서는 아니고 마케팅팀 다른 분이 올린 문서예요. 결재선에 제가 있는지는 모르겠어요. 기간은 기본값 그대로 최근 3개월이에요."
  - sender: AI
    text: "알려 주셔서 감사합니다. 확인된 내용을 정리해 전자결재 담당자에게 접수했습니다. 담당자가 확인한 뒤 결과를 이 대화로 알려 드리겠습니다."

